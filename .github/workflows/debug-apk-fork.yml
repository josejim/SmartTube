name: Debug APK (fork only)

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :smarttubetv:assembleStbetaDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: smarttubetv/build/outputs/apk/stbeta/debug/*.apk
          if-no-files-found: error
