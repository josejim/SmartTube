name: Debug APK (fork only)

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master

jobs:
  debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      # debug builds carry applicationIdSuffix ".dev" -> org.smarttube.beta.dev,
      # so they install next to the official app.
      - name: Build dev debug APK
        run: ./gradlew :smarttubetv:assembleStbetaDebug --no-daemon

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-dev
          path: |
            smarttubetv/build/outputs/apk/stbeta/debug/*.apk
            smarttubetv/build/outputs/apk/stbeta/debug/output-metadata.json
          if-no-files-found: error
